<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Reise wählen</title>
<style>
/* Auswahl-Widget der Seite "Reisekorrektur": Datum wählen (Kalender des
   Browsers), Reisen dieses Tages anklicken -- die verknüpfte Karte daneben
   zeigt die gewählte Reise zum Bearbeiten. Nur Lesezugriff: hier lässt sich
   nichts verschieben oder anlegen, geändert wird ausschließlich in der Karte.
   Ersetzt das Grist-Kalender-Widget, das trotz Lesezugriff Ziehen anbot. */
* { box-sizing: border-box; }

body {
  margin: 0;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
  font-size: 14px;
  color: #262633;
  background: #fff;
}

.leiste {
  position: sticky; top: 0;
  display: flex; gap: 6px; align-items: center;
  padding: 10px 12px; background: #fff;
  border-bottom: 1px solid #e8e8e8;
}
.leiste input[type=date] {
  flex: 1; min-width: 0;
  font: inherit; font-size: 16px; padding: 6px 8px;
  border: 1px solid #d9d9d9; border-radius: 4px;
}
.leiste button {
  font: inherit; cursor: pointer; padding: 6px 10px;
  border: 1px solid #16a34a; border-radius: 4px;
  background: #fff; color: #16a34a;
}
.leiste button:hover { background: #f0fdf4; }
.leiste button:disabled { opacity: .35; cursor: default; background: #fff; }

#liste { list-style: none; margin: 0; padding: 8px 12px; }
#liste li { margin-bottom: 6px; }
#liste button {
  width: 100%; text-align: left; cursor: pointer;
  font: inherit; padding: 8px 10px;
  border: 1px solid #e8e8e8; border-radius: 4px; background: #fff;
}
#liste button:hover { border-color: #16a34a; }
#liste button[aria-current=true] { border-color: #16a34a; background: #f0fdf4; }
#liste .zeit { font-weight: 600; }
#liste .weg  { display: block; color: #555; margin-top: 2px; overflow-wrap: anywhere; }

#hinweis { padding: 8px 12px; color: #777; }
</style>
</head>
<body>
<div class="leiste">
  <button type="button" id="zurueck" title="Vorige Reise">‹</button>
  <input type="date" id="tag" aria-label="Reisedatum">
  <button type="button" id="vor" title="Nächste Reise">›</button>
</div>
<ul id="liste"></ul>
<div id="hinweis"></div>

<script>
// LOGIK-ANFANG -- ohne DOM, geprüft von test_reiseauswahl.mjs

/* Grist liefert Datumswerte je nach Weg als Sekunden seit 1970 (UTC-
   Mitternacht) oder als Date -- beides auf "JJJJ-MM-TT", wie <input type=date>. */
const iso = v => v == null || v === "" ? ""
  : typeof v.toISOString === "function" ? v.toISOString().slice(0, 10)
  : typeof v === "number" ? new Date(v * 1000).toISOString().slice(0, 10)
  : String(v).slice(0, 10);

/* Reisen an diesem Tag -- eine mehrtägige auch an ihren Folgetagen. */
const amTag = (reisen, tag) => reisen
  .filter(r => iso(r.Datum) && iso(r.Datum) <= tag && tag <= (iso(r.Datum_Ende) || iso(r.Datum)))
  .sort((a, b) => String(a.Beginn || "").localeCompare(String(b.Beginn || "")));

/* Beginn-Datum der vorigen (-1) bzw. nächsten (+1) Reise, sonst "". */
const nachbar = (reisen, tag, richtung) => {
  const tage = [...new Set(reisen.map(r => iso(r.Datum)).filter(Boolean))].sort();
  return (richtung > 0 ? tage.find(t => t > tag) : tage.reverse().find(t => t < tag)) || "";
};

// LOGIK-ENDE

let reisen = [], gewaehlt = null;
const feld = document.getElementById("tag");

const datumDE = t => t.split("-").reverse().join(".");

function zeigen(tag, waehlen) {
  feld.value = tag;
  const liste = document.getElementById("liste");
  liste.replaceChildren();
  const treffer = amTag(reisen, tag);
  for (const r of treffer) {
    const knopf = document.createElement("button");
    knopf.type = "button";
    knopf.setAttribute("aria-current", String(r.id === gewaehlt));
    const zeit = document.createElement("span");
    zeit.className = "zeit";
    zeit.textContent = [r.Lfd_Nr ? `Nr. ${r.Lfd_Nr}` : "",
                        [r.Beginn, r.Ende].filter(Boolean).join("–")].filter(Boolean).join(" · ");
    const weg = document.createElement("span");
    weg.className = "weg";
    weg.textContent = r.Reiseweg || "";
    knopf.append(zeit, weg);
    knopf.onclick = () => grist.setCursorPos({ rowId: r.id });
    const li = document.createElement("li");
    li.append(knopf);
    liste.append(li);
  }
  document.getElementById("hinweis").textContent =
    !tag ? "Noch keine Reise erfasst."
    : treffer.length ? "" : `Keine Reise am ${datumDE(tag)}.`;
  document.getElementById("zurueck").disabled = !nachbar(reisen, tag, -1);
  document.getElementById("vor").disabled = !nachbar(reisen, tag, +1);
  /* Die erste Reise des Tages gleich wählen -- spart den Klick im
     Normalfall, dass an einem Tag genau eine Reise stattfand. */
  if (waehlen && treffer.length && !treffer.some(r => r.id === gewaehlt))
    grist.setCursorPos({ rowId: treffer[0].id });
}

feld.onchange = () => zeigen(feld.value, true);
document.getElementById("zurueck").onclick = () => zeigen(nachbar(reisen, feld.value, -1), true);
document.getElementById("vor").onclick = () => zeigen(nachbar(reisen, feld.value, +1), true);

/* Plugin-API von der einbettenden Grist-Instanz laden, nicht von einer festen
   Adresse (Begründung in ausdruck.html). */
const quelle = document.referrer ? new URL(document.referrer).origin
              : window.location.ancestorOrigins?.[0] || "";
if (!quelle) {
  document.getElementById("hinweis").textContent =
    "Herkunft der Grist-Instanz nicht ermittelbar -- Widget kann die Plugin-API nicht laden.";
} else {
  const s = document.createElement("script");
  s.src = quelle + "/grist-plugin-api.js";
  s.onload = () => {
    grist.ready({ requiredAccess: "read table", allowSelectBy: true });
    grist.onRecords(rows => {
      const erstes = !reisen.length;
      reisen = rows;
      /* Start auf der jüngsten Reise: täglich erfasst, also ist die zu
         korrigierende fast immer die letzte. */
      const start = feld.value || nachbar(reisen, "9999-12-31", -1);
      zeigen(start, erstes);
    }, { includeColumns: "normal" });
    grist.onRecord(r => {
      gewaehlt = r?.id ?? null;
      if (r && !amTag([r], feld.value).length) feld.value = iso(r.Datum);
      zeigen(feld.value, false);
    }, { includeColumns: "normal" });
  };
  document.head.appendChild(s);
}
</script>
</body>
</html>
