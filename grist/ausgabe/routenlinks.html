<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Routenlinks (Google Maps)</title>
<style>
/* Gegenstück zum Sheets-Blatt "GoogleMapsExport" -- Kopfblock (Antragssteller/
   Wohnort/Dienstort, wie S1) und Tabellenkopf (Nr./Datum/Reisebeginn/
   Reiseende/Wegstrecke/KM dienstlich/Routenlink) sind 1:1 aus der Vorlage
   (ReisekostenabrechnungFINAL.xlsx, Blatt "GoogleMapsExport") übernommen --
   Zeile 1-4 Kopf, Zeile 5 Tabellenkopf (grau, dünner Rahmen), Zeile 6ff Daten.
   Der Titel dort ("REISEKOSTENRECHNUNG") ist erkennbar aus S1 kopiert und
   für dieses Blatt sachlich falsch -- hier durch eine passende Überschrift
   ersetzt, der Rest der Kopfzeile (Antragssteller/Wohnort/Dienstort) bleibt.

   Kein Druckformular wie ausdruck.html: die Sheets-Vorlage nennt für dieses
   Blatt selbst keine Druckanweisung ("Nichts. Routenlink bei Bedarf
   nutzen") -- ein Link ist auf Papier ohnehin nicht klickbar. Deshalb
   Bildschirm-Maße (px) statt A4/mm, keine Druckleiste, kein "Drucken". */
:root {
  --rahmen: 1px solid #999;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  font-family: Arial, Helvetica, sans-serif;
  font-size: 13px;
  color: #111;
  background: #fff;
}

.leiste {
  position: sticky; top: 0; z-index: 10;
  display: flex; gap: 8px; align-items: center;
  padding: 8px 12px; background: #f0f0f0;
  border-bottom: 1px solid #ccc;
}
.leiste button {
  font: inherit; font-weight: 600; cursor: pointer;
  padding: 6px 14px; border: 1px solid #16a34a; border-radius: 4px;
  background: #fff; color: #16a34a;
}
.leiste button:hover { background: #f0fdf4; }

.wrap { padding: 12px; overflow-x: auto; }

table { border-collapse: collapse; width: 100%; min-width: 780px; }

.kopf { margin-bottom: 10px; }
.kopf td { border: var(--rahmen); padding: 4px 8px; vertical-align: top; }
.kopf .titel { font-size: 20px; font-weight: bold; }
.kopf .stand { font-size: 12px; font-weight: bold; text-align: right; vertical-align: bottom; }
.kopf .label { font-size: 11px; font-weight: bold; }
.kopf .wert  { font-size: 13px; }

.raster th, .raster td { border: var(--rahmen); padding: 4px 8px; text-align: left; }
.raster th { background: #bdbdbd; font-weight: 600; white-space: nowrap; }
.raster td.mitte, .raster th.mitte { text-align: center; }
.raster td.z-rechts, .raster th.z-rechts { text-align: right; }
.raster td.weg { max-width: 32em; }
.raster tbody tr:nth-child(even) { background: #fafafa; }

a { color: #1a73e8; text-decoration: none; }
a:hover { text-decoration: underline; }
</style>
</head>
<body>
<div class="leiste">
  <button type="button" id="neu-laden" hidden>Aktualisieren</button>
</div>
<div class="wrap">
  <table class="kopf">
    <colgroup>
      <col style="width:34%"><col style="width:33%"><col style="width:33%">
    </colgroup>
    <tr><td class="titel" colspan="2">Routenlinks</td>
        <td class="stand" id="k-stand"></td></tr>
    <tr><td class="label">Antragssteller/in:</td>
        <td class="label">Wohnort:</td>
        <td class="label">Dienstort:</td></tr>
    <tr><td class="wert" id="k-antragsteller"></td>
        <td class="wert" id="k-wohnort"></td>
        <td class="wert" id="k-dienstort"></td></tr>
  </table>

  <table class="raster">
    <thead>
      <tr>
        <th class="mitte">Nr.</th>
        <th>Datum</th>
        <th>Reisebeginn</th>
        <th>Reiseende</th>
        <th>Wegstrecke</th>
        <th class="z-rechts">KM dienstlich</th>
        <th class="mitte">Routenlink</th>
      </tr>
    </thead>
    <tbody id="daten"></tbody>
  </table>
</div>

<script>
/* Erfundene Beispieldaten, nur für die Vorschau im Browser ohne Grist. */
const beispielKopf = {
  stand: "01.01.2026 - 31.03.2026",
  antragsteller: "Musterfrau Erika, Referat 42",
  wohnort:       "Beispielweg 7, 00000 Musterstadt",
  dienstort:     "Verwaltungsstraße 1, 00000 Musterstadt",
};
const beispielReisen = [
  { nr:1, datum:"03.02.2026", von:"07:15", bis:"16:40", weg:"WO > KV > Beispieldorf > WO", km:87,
    link:"https://www.google.com/maps/dir/?api=1&origin=Beispielweg+7&destination=Beispielweg+7&waypoints=Amtsstr.+1|Dorfstr.+2" },
  { nr:2, datum:"05.02.2026", von:"08:00", bis:"12:10", weg:"WO > KV > WO", km:24,
    link:"https://www.google.com/maps/dir/?api=1&origin=Beispielweg+7&destination=Beispielweg+7&waypoints=Amtsstr.+1" },
  { nr:3, datum:"09.02.2026", von:"09:00", bis:"09:45", weg:"WO > KV > WO", km:0,
    link:"https://www.google.com/maps/dir/?api=1&origin=Beispielweg+7&destination=Beispielweg+7&waypoints=Amtsstr.+1" },
];

/* Tabellenzellen werden als HTML zusammengesetzt. Das Präfix html`…` schiebt
   jeden eingesetzten Wert durch esc(); Freitext-Orte können so kein Markup
   einschleusen. Ohne Präfix kein Schutz. */
const esc = s => String(s ?? "").replace(/[&<>"]/g,
  c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;" }[c]));
const html = (t, ...v) => t.reduce((a, s, i) => a + esc(v[i - 1]) + s);

/* Grist liefert Datumswerte als Sekunden seit 1970, UTC-Mitternacht. */
const tag = s => s == null ? "" : new Date(s * 1000).toLocaleDateString("de-DE",
  { day:"2-digit", month:"2-digit", year:"numeric", timeZone:"UTC" });

const zeilen = t => t.id.map((_, i) =>
  Object.fromEntries(Object.keys(t).map(k => [k, t[k][i]])));

const anschrift = (strasse, plz, ort) =>
  [strasse, [plz, ort].filter(Boolean).join(" ")].filter(Boolean).join(", ");

/* Der Routenlink braucht ein echtes <a href>, kein reiner Text -- deshalb
   hier NICHT html`` verwenden (das würde das Tag selbst escapen und den
   Link kaputt machen). Der Link steht stattdessen als data-Attribut in der
   Zelle (durchläuft dort ganz normal esc()) und wird erst danach per DOM-API
   in ein <a> umgesetzt -- ohne je als HTML-String geparst zu werden, sicherer
   als ein selbst zusammengebautes <a href="…">. */
function zeile(r) {
  return html`<tr>
    <td class="mitte">${r.nr ?? ""}</td>
    <td>${r.datum}</td>
    <td>${r.von}</td>
    <td>${r.bis}</td>
    <td class="weg">${r.weg}</td>
    <td class="z-rechts">${r.km}</td>
    <td class="mitte" data-link="${r.link || ""}"></td></tr>`;
}

function rendern(kopf, reisen) {
  document.getElementById("k-stand").textContent = kopf.stand;
  document.getElementById("k-antragsteller").textContent = kopf.antragsteller;
  document.getElementById("k-wohnort").textContent = kopf.wohnort;
  document.getElementById("k-dienstort").textContent = kopf.dienstort;

  const tb = document.getElementById("daten");
  tb.innerHTML = reisen.map(zeile).join("");
  for (const td of tb.querySelectorAll("td[data-link]")) {
    const link = td.dataset.link;
    td.removeAttribute("data-link");
    if (!link) continue;
    const a = document.createElement("a");
    a.href = link;
    a.target = "_blank";
    a.rel = "noopener";
    a.textContent = "Route";
    td.appendChild(a);
  }
}

/* ---------------------------------------------------------- Grist-Anbindung */

async function ausGrist() {
  const [e] = zeilen(await grist.docApi.fetchTable("Einstellungen"));
  if (!e) {
    document.getElementById("k-antragsteller").textContent =
      "Tabelle 'Einstellungen' ist leer -- setup.py laufen lassen, dann 'Aktualisieren'.";
    return;
  }
  const von = e.Zeitraum_von, bis = e.Zeitraum_bis;
  const kopf = {
    stand: [tag(von), tag(bis)].filter(Boolean).join(" - "),
    antragsteller: [[e.Name, e.Vorname].filter(Boolean).join(" "),
                    e.Organisationseinheit].filter(Boolean).join(", "),
    wohnort:   anschrift(e.Wohnort_Strasse, e.Wohnort_PLZ, e.Wohnort_Ort),
    dienstort: anschrift(e.Dienstort_Strasse, e.Dienstort_PLZ, e.Dienstort_Ort),
  };

  /* Gefiltert wird ueber den Reisebeginn -- siehe ausdruck.html: eine Reise,
     die vor `von` beginnt, gehoert in die vorige Abrechnung. */
  const reisen = zeilen(await grist.docApi.fetchTable("Reisen"))
    .filter(r => r.Datum != null
                 && (von == null || r.Datum >= von)
                 && (bis == null || r.Datum <= bis))
    .sort((a, b) => a.Datum - b.Datum)
    .map(r => ({
      nr:   r.Lfd_Nr,
      datum: tag(r.Datum),
      von:  r.Beginn || "",
      bis:  r.Ende || "",
      weg:  r.Reiseweg || "",
      km:   r.KM_dienstlich || 0,
      link: r.Maps_Link || "",
    }));

  rendern(kopf, reisen);
}

if (window.self === window.top) {
  rendern(beispielKopf, beispielReisen);
} else {
  /* Plugin-API von der einbettenden Grist-Instanz laden, nicht von einer festen
     Adresse -- so steht der Hostname der Instanz nicht in diesem offenen Repo.
     ancestorOrigins als zweite Quelle: eine strenge Referrer-Policy loescht
     document.referrer, und ein fest verdrahtetes docs.getgrist.com waere dann
     doppelt falsch -- die eigene Instanz bliebe unerreichbar, und ein fremder
     Host bekaeme einen Request aus dem Dokument. Lieber nichts laden und es
     sagen. */
  const quelle = document.referrer ? new URL(document.referrer).origin
                : window.location.ancestorOrigins?.[0] || "";
  if (!quelle) {
    document.getElementById("k-antragsteller").textContent =
      "Herkunft der Grist-Instanz nicht ermittelbar (Referrer-Policy) -- "
      + "Widget kann die Plugin-API nicht laden.";
    throw new Error("keine Grist-Herkunft");
  }
  const s = document.createElement("script");
  s.src = quelle + "/grist-plugin-api.js";
  s.onload = () => {
    grist.ready({ requiredAccess: "full" });   // liest zwei Tabellen
    /* onRecords feuert nur bei Aenderungen an 'Einstellungen' -- eine neu
       erfasste oder korrigierte Reise erreicht das Widget NICHT von selbst. */
    grist.onRecords(ausGrist);
    const knopf = document.getElementById("neu-laden");
    knopf.hidden = false;
    knopf.onclick = ausGrist;
  };
  document.head.appendChild(s);
}
</script>
</body>
</html>
